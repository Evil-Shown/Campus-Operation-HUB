name: Smart Campus CI

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Spring Boot — compile, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: campus_ops_test
          POSTGRES_USER: campus_user
          POSTGRES_PASSWORD: campus123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compile
        run: mvn compile -f server/pom.xml -q

      - name: Test
        run: mvn test -f server/pom.xml
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/campus_ops_test
          SPRING_DATASOURCE_USERNAME: campus_user
          SPRING_DATASOURCE_PASSWORD: campus123
          APP_JWT_SECRET: c21hcnRjYW1wdXNzdXBlcnNlY3JldGtleWZvcmphdmFzcHJpbmcyMDI2bG9uZ2Vub3VnaA==
          APP_JWT_EXPIRATION_MS: 86400000
          APP_UPLOAD_DIR: ./test-uploads
          APP_FRONTEND_URL: http://localhost:5173
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID: test-id
          SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET: test-secret
