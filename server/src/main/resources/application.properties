# ============================================================
# Smart Campus Operations Hub — application.properties
# ============================================================

# Server
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/campus_op_hub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:campus_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:campus123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

# Multipart file upload (ticket attachments)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=15MB

# Google OAuth2 — fill in real values from Google Cloud Console
spring.security.oauth2.client.registration.google.client-id=YOUR_GOOGLE_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=YOUR_GOOGLE_CLIENT_SECRET
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# JWT
app.jwt.secret=${APP_JWT_SECRET:c21hcnRjYW1wdXNzdXBlcnNlY3JldGtleWZvcmphdmFzcHJpbmcyMDI2bG9uZ2Vub3VnaA==}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# File storage
app.upload.dir=${APP_UPLOAD_DIR:./uploads}

# Frontend URL (used in OAuth redirect)
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info
