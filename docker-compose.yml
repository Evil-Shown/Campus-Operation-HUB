services:
  postgres:
    image: postgres:15
    container_name: campus_ops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: campus_op_hub
      POSTGRES_USER: campus_user
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - campus_ops_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus_user -d campus_op_hub"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campus_ops_pgdata:
